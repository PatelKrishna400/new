<div class="page-view" id="pageLeaderboard">
  <!-- Top Action Nav Row (Req 18: Circular Home Button) -->
  <div class="xp-top-actions-row">
    <button class="lb-home-circle-btn" onclick="switchPage('home')" aria-label="Back to Home" title="Back">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>

    <div class="leaderboard-header-title-pill">
      <span class="leaderboard-trophy-icon">🏆</span>
      <span>DIAMOND WIN RANKINGS</span>
    </div>

    <div class="leaderboard-live-pill">
      <span class="live-dot-pulse"></span>
      <span>REAL-TIME</span>
    </div>
  </div>


  <!-- Master Leaderboard Card Wrapper -->
  <section class="leaderboard-master-card">
    
    <!-- ================================================================
         TOP 3 CHAMPIONS 3D STEP PODIUM
         ================================================================ -->
    <div class="podium-section-wrap">
      <div class="podium-stage-glow"></div>
      
      <div class="podium-step-container">
        
        <!-- STEP 2: 2ND PLACE (SILVER) -->
        <div class="podium-step step-rank-2" id="podiumRank2">
          <div class="podium-player-card">
            <div class="podium-crown-badge silver">🥈 #2</div>
            <div class="podium-avatar-wrapper silver-ring">
              <div class="podium-avatar-box" id="podiumAvatar2"></div>
            </div>
            <div class="podium-player-name" id="podiumName2">---</div>
            <div class="podium-event-badge" id="podiumEvent2">🥈 Master</div>
            <div class="podium-score-pill silver" id="podiumScore2">💎 0 Wins</div>
          </div>
          <!-- 3D Pedestal Stand -->
          <div class="podium-pedestal pedestal-silver">
            <div class="pedestal-top"></div>
            <div class="pedestal-front">
              <span class="pedestal-num">2</span>
              <span class="pedestal-medal-tag">SILVER</span>
            </div>
          </div>
        </div>

        <!-- STEP 1: 1ST PLACE (GOLD CHAMPION) -->
        <div class="podium-step step-rank-1" id="podiumRank1">
          <div class="podium-player-card champion">
            <div class="podium-halo-rays"></div>
            <div class="podium-crown-badge gold">👑 #1 CHAMPION</div>
            <div class="podium-avatar-wrapper gold-ring">
              <div class="podium-avatar-box" id="podiumAvatar1"></div>
              <div class="podium-winner-sparkle">✦</div>
            </div>
            <div class="podium-player-name champion-name" id="podiumName1">---</div>
            <div class="podium-event-badge gold-badge" id="podiumEvent1">👑 Champion</div>
            <div class="podium-score-pill gold" id="podiumScore1">💎 0 Wins</div>
          </div>
          <!-- 3D Pedestal Stand -->
          <div class="podium-pedestal pedestal-gold">
            <div class="pedestal-top"></div>
            <div class="pedestal-front">
              <span class="pedestal-num">1</span>
              <span class="pedestal-medal-tag">CHAMPION</span>
            </div>
          </div>
        </div>

        <!-- STEP 3: 3RD PLACE (BRONZE) -->
        <div class="podium-step step-rank-3" id="podiumRank3">
          <div class="podium-player-card">
            <div class="podium-crown-badge bronze">🥉 #3</div>
            <div class="podium-avatar-wrapper bronze-ring">
              <div class="podium-avatar-box" id="podiumAvatar3"></div>
            </div>
            <div class="podium-player-name" id="podiumName3">---</div>
            <div class="podium-event-badge" id="podiumEvent3">🥉 Elite</div>
            <div class="podium-score-pill bronze" id="podiumScore3">💎 0 Wins</div>
          </div>
          <!-- 3D Pedestal Stand -->
          <div class="podium-pedestal pedestal-bronze">
            <div class="pedestal-top"></div>
            <div class="pedestal-front">
              <span class="pedestal-num">3</span>
              <span class="pedestal-medal-tag">BRONZE</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- ================================================================
         TOP 4 TO 100 PLAYERS LIST (SCROLLABLE)
         ================================================================ -->
    <div class="leaderboard-roster-header">
      <span class="roster-title">GLOBAL COMMUNITY RANKINGS</span>
      <span class="roster-sub" id="rosterTotalSubtitle">Live Standings</span>
    </div>

    <div class="leaderboard-scroll-list" id="leaderboardListContainer">
      <!-- Populated dynamically by renderLeaderboardRoster() -->
    </div>

  </section>

  <!-- ================================================================
       STICKY / PINNED USER'S LIVE STANDING BAR
       ================================================================ -->
  <div class="leaderboard-my-standing-bar" id="leaderboardMyStandingBar">
    <div class="my-standing-left">
      <div class="my-rank-pill" id="lbMyRankPill">#1</div>
      <div class="my-avatar-mini" id="lbMyAvatarMini">👑</div>
      <div class="my-info-col">
        <div class="my-name-row">
          <span class="my-name" id="lbMyName">Player</span>
          <span class="my-you-badge">YOU</span>
        </div>
        <span class="my-event-chip" id="lbMyEventChip">💎 Diamond Wins</span>
      </div>
    </div>
    <div class="my-standing-right">
      <div class="my-coin-total" id="lbMyCoinTotal">💎 0 Wins</div>
      <span class="my-coin-label">DIAMOND WINS</span>
    </div>
  </div>
</div>
