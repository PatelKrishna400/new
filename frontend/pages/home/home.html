<div class="page-view active" id="pageHome">
  <div class="home-reactor-container">

    <!-- 1. TOP: Global Leaderboard Feature Card & Category Tabs -->
    <section class="home-leaderboard-tab-card" id="homeLeaderboardSection" onclick="switchPage('leaderboard')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();switchPage('leaderboard');}" role="button" tabindex="0" title="Tap to open Global Leaderboard">
      <!-- Ambient Shimmer & Atmospheric Glow -->
      <div class="hlb-card-glow"></div>
      <div class="hlb-shimmer-sweep"></div>
      
      <!-- 1. Header Row: 3D Trophy + Prominent Heading + Live Badge + Right Action Arrow -->
      <div class="hlb-header-row">
        <div class="hlb-header-left">
          <div class="hlb-badge-box">
            <div class="hlb-trophy-symbol">🏆</div>
            <div class="hlb-sparkle-dot s1">✦</div>
            <div class="hlb-sparkle-dot s2">✨</div>
          </div>
          <div class="hlb-heading-group">
            <div class="hlb-top-meta-pills">
              <span class="hlb-season-pill">🔥 SEASON 1</span>
              <span class="hlb-live-pill">
                <span class="hlb-pulse-dot"></span>
                <span>LIVE</span>
              </span>
            </div>
            <h3 class="hlb-main-heading">GLOBAL LEADERBOARD</h3>
          </div>
        </div>

        <div class="hlb-header-right">
          <div class="hlb-open-cta-pill">
            <span>TOP 100</span>
            <svg class="hlb-chevron-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- 2. Middle Spotlight Row: Podium Leaders Teaser & Prize Tag -->
      <div class="hlb-spotlight-row">
        <div class="hlb-leaders-preview">
          <div class="hlb-avatar-stack">
            <div class="hlb-mini-avatar gold-av" title="#1 Champion">👑</div>
            <div class="hlb-mini-avatar silver-av" title="#2 Silver">🥈</div>
            <div class="hlb-mini-avatar bronze-av" title="#3 Bronze">🥉</div>
          </div>
          <div class="hlb-leader-details">
            <span class="hlb-leader-label">#1 LEADER</span>
            <span class="hlb-leader-name">QuantumKing</span>
            <span class="hlb-leader-score">28.9M 🪙</span>
          </div>
        </div>
        <div class="hlb-prize-tag">
          <span class="hlb-prize-emoji">🎁</span>
          <span class="hlb-prize-amount">500K Pool</span>
        </div>
      </div>

      <!-- 3. Bottom Interactive Quick Category Tabs -->
      <div class="hlb-category-tabs-grid" role="group" aria-label="Leaderboard Categories">
        <button type="button" class="hlb-cat-btn gold" onclick="event.stopPropagation(); switchHomeLeaderboardTab('coins');" title="Open Coin Rankings">
          <span class="hlb-cat-icon">👑</span>
          <span class="hlb-cat-text">Coin Rankings</span>
        </button>
        <button type="button" class="hlb-cat-btn purple" onclick="event.stopPropagation(); switchHomeLeaderboardTab('spin');" title="Open Spinner Event Rankings">
          <span class="hlb-cat-icon">🎡</span>
          <span class="hlb-cat-text">Spin Event</span>
        </button>
        <button type="button" class="hlb-cat-btn cyan" onclick="event.stopPropagation(); switchHomeLeaderboardTab('taps');" title="Open Energy Tap Rankings">
          <span class="hlb-cat-icon">⚡</span>
          <span class="hlb-cat-text">Energy Taps</span>
        </button>
      </div>
    </section>

    <!-- 2. MIDDLE: Quantum Energy Reactor (Tap to generate energy) -->
    <section class="reactor-card" id="reactorSection">
      <div class="reactor-header">
        <div class="reactor-pill-cyan">
          <svg class="pill-lightning" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
          <span>QUANTUM ENERGY REACTOR</span>
        </div>

        <div class="reactor-pill-dark" id="comboPill">
          <span class="combo-flame">🔥</span>
          <span id="comboMultiplierText">1.0x COMBO</span>
        </div>
      </div>

      <div class="orb-stage" id="orbStage">
        <!-- Central Quantum Plasma Orb Wrapper -->
        <div class="orb-center-wrapper">
          <div class="orb-aura aura-1"></div>
          <div class="orb-aura aura-2"></div>
          <div class="orb-particle-layer" id="orbParticleLayer"></div>

          <button class="reactor-orb" id="reactorOrb" aria-label="Tap to generate energy">
            <div class="orb-inner-gloss"></div>
            <div class="orb-electric-ring"></div>
            <div class="orb-core">
              <!-- High-Voltage Quantum Core Lightning Bolt -->
              <svg class="orb-lightning-bolt" viewBox="0 0 24 24" width="76" height="76" fill="currentColor">
                <path d="M13 2L3 14h9l-1.5 8 10.5-12h-9l1.5-8z"/>
              </svg>
            </div>
          </button>
        </div>
      </div>

      <div class="reactor-footer">
        <div class="energy-counter-pill" id="energyCounterPill" onclick="switchPage('energy')" style="cursor: pointer;" title="Energy Balance - Tap to Mine Energy">
          <svg class="energy-icon icon-left" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
          <span class="energy-value" id="energyTapCount">0</span>
          <svg class="energy-icon icon-right" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </div>

        <!-- Multi-Tap Power Selector (*1, *2, *3, *5, *10, *50, *100) -->
        <div class="multi-tap-strip" id="multiTapStrip" role="group" aria-label="Multi-Tap Power Multiplier">
          <button type="button" class="multi-tap-circle active" id="btnMultiTap1" onclick="setMultiTapMultiplier(1)" title="*1 Multi-Tap (1 Energy/click)">*1</button>
          <button type="button" class="multi-tap-circle" id="btnMultiTap2" onclick="setMultiTapMultiplier(2)" title="*2 Multi-Tap (2 Energy/click, unlocks at 100+ Energy)" style="display: none;">*2</button>
          <button type="button" class="multi-tap-circle" id="btnMultiTap3" onclick="setMultiTapMultiplier(3)" title="*3 Multi-Tap (3 Energy/click, unlocks at 250+ Energy)" style="display: none;">*3</button>
          <button type="button" class="multi-tap-circle" id="btnMultiTap5" onclick="setMultiTapMultiplier(5)" title="*5 Multi-Tap (5 Energy/click, unlocks at 500+ Energy)" style="display: none;">*5</button>
          <button type="button" class="multi-tap-circle" id="btnMultiTap10" onclick="setMultiTapMultiplier(10)" title="*10 Multi-Tap (10 Energy/click, unlocks at 1000+ Energy)" style="display: none;">*10</button>
          <button type="button" class="multi-tap-circle" id="btnMultiTap50" onclick="setMultiTapMultiplier(50)" title="*50 Multi-Tap (50 Energy/click, unlocks at 5000+ Energy)" style="display: none;">*50</button>
          <button type="button" class="multi-tap-circle" id="btnMultiTap100" onclick="setMultiTapMultiplier(100)" title="*100 Multi-Tap (100 Energy/click, unlocks at 10000+ Energy)" style="display: none;">*100</button>
        </div>
      </div>
    </section>

    <!-- 3. BOTTOM: QUANTUM DIAMOND GENERATOR SHOWCASE -->
    <section class="diamond-generator-home-section" id="diamondGenHomeSection">
      <div class="dgh-card-glow"></div>
      
      <div class="dgh-header-row">
        <div class="dgh-header-left">
          <span class="dgh-gem-icon">💎</span>
          <div class="dgh-title-group">
            <h2 class="dgh-main-title font-sci">DIAMOND GENERATOR</h2>
            <div class="dgh-rate-text font-mono" id="dgeHomeRateVal">+0.000001 💎 / 60.00s</div>
          </div>
        </div>
        <div class="dgh-status-badge font-sci" id="dgStatusText">READY (100 ⚡)</div>
      </div>

      <div class="dgh-actions-row">
        <button type="button" class="btn-start-diamond-gen dgh-start-btn font-sci" id="btnStartDiamondGenHome" onclick="startDiamondGeneration()">
          <span>⚡ START (100 ⚡)</span>
        </button>

        <button type="button" class="dgh-open-console-btn font-sci" onclick="switchPage('diamond-generator')">
          <span>UPGRADE &amp; DISCOUNTS ▶</span>
        </button>
      </div>
    </section>

    <!-- Home Action Pop-up Modal Backdrop & Dialog -->
    <div class="home-popup-backdrop" id="homePopupBackdrop" onclick="closeHomeActionPopup(event)">
      <div class="home-popup-card" id="homePopupCard" onclick="event.stopPropagation()">
        <div class="home-popup-drag-handle"></div>
        <button class="home-popup-close-btn" id="homePopupCloseBtn" onclick="closeHomeActionPopup()" aria-label="Close popup">&times;</button>
        
        <div class="home-popup-header" id="homePopupHeader"></div>
        <div class="home-popup-body" id="homePopupBody"></div>
      </div>
    </div>

  </div>
</div>
