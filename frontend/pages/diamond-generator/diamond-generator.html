<div class="page-view" id="pageDiamondGenerator">
  <!-- Minimal Gaming Header -->
  <header class="dg-header-bar">
    <div class="dg-header-left">
      <button onclick="switchPage('home')" class="dg-back-btn" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <span class="dg-title font-sci">DIAMOND GENERATOR</span>
    </div>

    <!-- Live Resource Badges -->
    <div class="dg-resources">
      <div class="dg-pill cyan">
        <span>💎</span>
        <span id="dgStickyDiamonds" class="font-mono">0.000000</span>
      </div>
      <div class="dg-pill gold">
        <span>🪙</span>
        <span id="dgStickyCoins" class="font-mono">0</span>
      </div>
      <div class="dg-pill sky">
        <span>⚡</span>
        <span id="dgStickyEnergy" class="font-mono">0</span>
      </div>
    </div>
  </header>

  <div class="dg-container">
    <!-- Generator Stage -->
    <section class="dg-stage-card">
      <div class="dg-stage-top">
        <span class="dg-status-tag" id="dgStatusBadge">READY</span>
        <span class="dg-rate-tag font-mono" id="dgRateHeaderBadge">+0.000001 💎 / 60.00s</span>
      </div>

      <!-- Hologram Node -->
      <div class="dg-core-wrapper">
        <div class="dg-aura"></div>
        <svg class="dg-ring-svg" viewBox="0 0 160 160">
          <circle cx="80" cy="80" r="70" class="dg-ring-track"/>
          <circle cx="80" cy="80" r="70" class="dg-ring-fill" id="diamondProgressRing" stroke-dasharray="439.82" stroke-dashoffset="439.82"/>
        </svg>

        <div class="diamond-crystal-node" id="diamondCrystalNode">
          <svg class="diamond-core-art" viewBox="0 0 100 100" fill="none">
            <defs>
              <linearGradient id="dFacetTop" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f0f9ff"/>
                <stop offset="100%" stop-color="#38bdf8"/>
              </linearGradient>
              <linearGradient id="dFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a5f3fc"/>
                <stop offset="100%" stop-color="#0891b2"/>
              </linearGradient>
              <linearGradient id="dFacetCenter" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#67e8f9"/>
                <stop offset="100%" stop-color="#0284c7"/>
              </linearGradient>
              <linearGradient id="dFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#0c4a6e"/>
              </linearGradient>
              <filter id="diamondCoreShine" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00f0ff" flood-opacity="0.9"/>
              </filter>
            </defs>
            <g filter="url(#diamondCoreShine)">
              <polygon points="30,22 70,22 84,38 16,38" fill="url(#dFacetTop)"/>
              <polygon points="16,38 30,22 40,38" fill="url(#dFacetLeft)" opacity="0.95"/>
              <polygon points="84,38 70,22 60,38" fill="url(#dFacetRight)" opacity="0.95"/>
              <polygon points="30,22 50,38 70,22" fill="#e0f2fe" opacity="0.9"/>
              <polygon points="40,38 50,22 60,38 50,38" fill="#ffffff"/>
              <polygon points="16,38 50,38 50,86" fill="url(#dFacetLeft)"/>
              <polygon points="84,38 50,38 50,86" fill="url(#dFacetRight)"/>
              <polygon points="35,46 50,86 65,46 50,52" fill="url(#dFacetCenter)" opacity="0.95"/>
              <circle cx="50" cy="40" r="2.5" fill="#ffffff"/>
            </g>
          </svg>

          <div class="diamond-core-info">
            <span class="diamond-countdown-text font-mono" id="diamondCountdownText">60.0s</span>
            <span class="diamond-rate-label font-mono" id="diamondCoreRateLabel">+0.000001 💎</span>
          </div>
        </div>
      </div>

      <!-- Start Button with Energy -->
      <button type="button" class="btn-start-diamond-gen" id="btnStartDiamondGen" onclick="startDiamondGeneration()">
        <span class="btn-shine"></span>
        <span id="btnStartDiamondGenText">⚡ START GENERATION (100 ⚡)</span>
      </button>
    </section>

    <!-- Upgrades Row (Power & Speed) -->
    <section class="dg-upgrades-grid">
      <!-- Power Card -->
      <div class="dg-upg-card" id="cardPowerUpg">
        <div class="dg-upg-hdr">
          <div class="dg-upg-title-wrap">
            <span class="dg-upg-icon">💎</span>
            <span class="dg-upg-title font-sci">POWER</span>
          </div>
          <span class="dg-level-tag" id="ducOutputLevelBadge">Lv. 1</span>
        </div>
        <div class="dg-upg-sub font-mono" id="ducOutputSub">+0.000001 💎/cycle</div>

        <button type="button" class="dg-btn-upg" id="btnUpgradeOutput" onclick="purchaseDiamondOutputUpgrade()">
          <span id="btnUpgradeOutputText">UPGRADE (+0.000001 💎)</span>
          <span class="dg-btn-cost font-mono" id="btnUpgradeOutputCostText">50 🪙</span>
        </button>
      </div>

      <!-- Speed Card -->
      <div class="dg-upg-card" id="cardSpeedUpg">
        <div class="dg-upg-hdr">
          <div class="dg-upg-title-wrap">
            <span class="dg-upg-icon">⚡</span>
            <span class="dg-upg-title font-sci">SPEED</span>
          </div>
          <span class="dg-level-tag speed" id="ducSpeedLevelBadge">Lv. 1</span>
        </div>
        <div class="dg-upg-sub font-mono" id="ducSpeedSub">60.00s (-0.01s)</div>

        <button type="button" class="dg-btn-upg speed" id="btnUpgradeSpeed" onclick="purchaseDiamondSpeedUpgrade()">
          <span id="btnUpgradeSpeedText">OVERCLOCK (-0.01s)</span>
          <span class="dg-btn-cost font-mono" id="btnUpgradeSpeedCostText">10 💎</span>
        </button>
      </div>
    </section>

    <!-- Tabbed Cost Reducer Section (Two Options: Power or Speed) -->
    <section class="dg-cost-reducer-section">
      <!-- Tab Switch -->
      <div class="dg-cost-tabs" role="tablist">
        <button type="button" class="dg-tab-opt active font-sci" id="tabPowerCost" onclick="switchDgCostTab('power')">
          <span>⚡ POWER DISCOUNT</span>
        </button>
        <button type="button" class="dg-tab-opt font-sci" id="tabSpeedCost" onclick="switchDgCostTab('speed')">
          <span>⏱️ SPEED DISCOUNT</span>
        </button>
      </div>

      <!-- Tab Content: Power Cost Reducer -->
      <div class="dg-tab-panel active" id="panelPowerCost">
        <div class="dg-reducer-card">
          <div class="dg-reducer-top">
            <span class="dg-reducer-title font-sci">COIN COST REDUCER</span>
            <span class="dg-reducer-badge font-mono" id="powerDiscountBadge">-0 🪙 DISCOUNT</span>
          </div>

          <!-- Watch Ad Action -->
          <button type="button" class="dg-ad-btn" id="btnPowerAdDiscount" onclick="watchPowerAdDiscount()">
            <span class="dg-ad-icon">🎬</span>
            <span class="dg-ad-txt" id="powerAdBtnText">Watch Ad (-10 Coins Cost)</span>
          </button>

          <!-- Compulsory 3-Ads Milestone Notice (Every 10 Levels) -->
          <div class="dg-milestone-box" id="powerMilestoneBox" style="display: none;">
            <div class="dg-milestone-hdr">
              <span class="text-amber-400 font-bold">🔒 Level Unlock Required</span>
              <span class="font-mono text-cyan-300 font-black" id="powerMilestoneProgressText">0 / 3 Ads</span>
            </div>
            <button type="button" class="dg-milestone-btn" id="btnPowerMilestoneAd" onclick="watchPowerMilestoneAd()">
              <span>🎬 Watch Required Ad (30s Timer)</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Tab Content: Speed Cost Reducer -->
      <div class="dg-tab-panel" id="panelSpeedCost">
        <div class="dg-reducer-card">
          <div class="dg-reducer-top">
            <span class="dg-reducer-title font-sci">DIAMOND COST REDUCER</span>
            <span class="dg-reducer-badge speed font-mono" id="speedDiscountBadge">-0 💎 DISCOUNT</span>
          </div>

          <!-- Watch Ad Action -->
          <button type="button" class="dg-ad-btn speed" id="btnSpeedAdDiscount" onclick="watchSpeedAdDiscount()">
            <span class="dg-ad-icon">🎬</span>
            <span class="dg-ad-txt" id="speedAdBtnText">Watch Ad (-1 Diamond Cost)</span>
          </button>

          <!-- Compulsory 3-Ads Milestone Notice (Every 10 Levels) -->
          <div class="dg-milestone-box" id="speedMilestoneBox" style="display: none;">
            <div class="dg-milestone-hdr">
              <span class="text-amber-400 font-bold">🔒 Level Unlock Required</span>
              <span class="font-mono text-cyan-300 font-black" id="speedMilestoneProgressText">0 / 3 Ads</span>
            </div>
            <button type="button" class="dg-milestone-btn" id="btnSpeedMilestoneAd" onclick="watchSpeedMilestoneAd()">
              <span>🎬 Watch Required Ad (30s Timer)</span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
