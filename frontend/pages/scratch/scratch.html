<div class="page-view" id="pageScratch">
  <!-- Top Action Nav Row -->
  <div class="xp-top-actions-row">
    <button class="xp-back-btn" onclick="switchPage('reward')">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Back</span>
    </button>

    <div class="scratch-header-title-pill">
      <span class="scratch-sparkle-icon">✨</span>
      <span>QUANTUM SCRATCH TICKET</span>
    </div>

    <div class="scratch-card-header-pill" id="scratchCardHeaderPill" onclick="dealNewSingleCard(true)">
      <span class="card-pill-icon">🎴</span>
      <span class="card-pill-val" id="scratchCardsVal">0</span>
      <span class="card-add-btn">+</span>
    </div>
  </div>

  <!-- ONE CARD LUXURY SCRATCH TICKET (FULL PAGE VIEW) -->
  <section class="scratch-arena-card single-card-arena" id="scratchSingleCardArea">
    <!-- Ticket Container -->
    <div class="quantum-ticket-card" id="quantumTicketCard">
      <!-- Ticket Top Header -->
      <div class="ticket-header-strip">
        <div class="ticket-brand">
          <span class="ticket-logo-spark">✦</span>
          <span class="ticket-brand-name">QUANTUM FORTUNE</span>
          <span class="ticket-brand-sub">INSTANT WIN</span>
        </div>
        <div class="ticket-meta-badges">
          <span class="ticket-serial-badge" id="ticketSerialText">#TKT-78491</span>
          <span class="ticket-tier-badge" id="ticketTierBadge">👑 JACKPOT TIER</span>
        </div>
      </div>

      <!-- Perforated Ticket Divider -->
      <div class="ticket-perforation-line">
        <div class="notch left"></div>
        <div class="dashed-line"></div>
        <div class="notch right"></div>
      </div>

      <!-- Central Scratch Box: Gray Film Covering the Hidden Reward -->
      <div class="single-scratch-box-wrap">
        <!-- Underneath: Secret Hidden Reward Layer -->
        <div class="single-reward-content" id="singleRewardContent">
          <div class="reward-spinning-aura" id="rewardSpinningAura"></div>
          <div class="reward-icon-badge-box">
            <span class="reward-icon-huge" id="singleRewardIcon">🪙</span>
          </div>
          <div class="reward-meta-box">
            <div class="reward-revealed-tag" id="singleRewardTag">LUCKY WINNER!</div>
            <div class="reward-amount-display" id="singleRewardAmount">+500 COINS</div>
            <div class="reward-subtitle-desc" id="singleRewardDesc">Claimed to your vault!</div>
          </div>
          <div class="reward-stamp-badge" id="singleRewardStamp">REVEALED</div>
        </div>

        <!-- Overneath: Realistic Metallic Gray Scratch Film Canvas -->
        <canvas class="scratch-film-canvas" id="scratchCanvas"></canvas>

        <!-- Scratch Dust Particles Container -->
        <div class="scratch-dust-layer" id="scratchDustLayer"></div>
      </div>

      <!-- Ticket Footer: Scratch Progress & Hint -->
      <div class="ticket-progress-bar-wrap">
        <div class="ticket-progress-header">
          <span class="progress-title">SCRATCH PROGRESS</span>
          <span class="progress-percent" id="scratchProgressText">0% Scratched</span>
        </div>
        <div class="ticket-progress-track">
          <div class="ticket-progress-fill" id="scratchProgressBar" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Security Barcode Strip -->
      <div class="ticket-barcode-strip">
        <div class="barcode-lines">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <span class="barcode-text">AUTHENTICATED DIGITAL CRYPTO TICKET</span>
      </div>
    </div>

    <!-- Status Box -->
    <div class="scratch-status-box" id="singleScratchStatusBox">
      <span id="singleScratchStatusText">Rub or scratch the metallic foil to reveal your prize!</span>
    </div>

    <!-- Action Buttons -->
    <div class="scratch-actions-wrapper">
      <div class="scratch-dual-btn-row">
        <button class="scratch-btn-secondary" id="btnSingleQuickScratch" onclick="quickScratchSingleCard()">
          <span>⚡ QUICK REVEAL</span>
        </button>
        <button class="scratch-action-main-btn" id="btnSingleNewCard" onclick="dealNewSingleCard(true)">
          <span id="scratchMainBtnLabel">🎴 NEW TICKET (1 CARD)</span>
        </button>
      </div>
      <button class="scratch-ad-buy-btn" id="btnSingleAdBuy" onclick="buyScratchCardWithAd()">
        <span>🎬 GET 1 FREE CARD (WATCH AD)</span>
      </button>
    </div>
  </section>
</div>
