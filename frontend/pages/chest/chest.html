<div class="page-view" id="pageChest">
        
        <!-- Top Action Nav Row -->
        <div class="xp-top-actions-row">
          <button class="xp-back-btn" onclick="switchPage('reward')">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>Back</span>
          </button>

          <div class="xp-timer-pill">
            <span>🧰 MYSTERY CHEST</span>
          </div>

          <div class="xp-level-badge-btn" style="pointer-events: none;">
            <span>🔑 <span id="chestKeysVal">0</span> Keys</span>
          </div>
        </div>

        <!-- Key Balance Strip -->
        <div class="spin-balance-pill-strip">
          <div class="spin-balance-pill-inner chest-key-pill">
            <span class="ticket-icon-glow">🔑</span>
            <span class="ticket-balance-label">AVAILABLE KEYS:</span>
            <span class="ticket-balance-val gold" id="chestAvailableKeys">0 Keys</span>
          </div>
        </div>

        <!-- 3 Interactive Chest Boxes Stage Card -->
        <section class="chest-stage-card">
          <div class="chest-rays-aura"></div>
          
          <div class="chest-stage-intro">
            <h3 class="three-chest-title" id="chestStageTitle">Choose 1 of 3 Mystery Chests</h3>
            <p class="three-chest-subtitle" id="chestStageSubtitle">Pick any chest box to unlock using 1 Winning Key!</p>
          </div>

          <!-- 3 Chest Boxes Container -->
          <div class="three-chests-container" id="threeChestsContainer">
            <!-- Chest Box 1 -->
            <div class="chest-box-card" id="chestBox1" onclick="onChestBoxClicked(1)">
              <div class="chest-box-glow"></div>
              <div class="chest-mini-aura"></div>
              <div class="chest-box-art">
                <div class="chest-floating-prize" id="chestFloatingPrize1"></div>
                <div class="chest-mini-lid" id="chestLid1">
                  <svg viewBox="0 0 80 40" class="chest-svg-lid">
                    <path d="M8 36 L16 12 Q40 4 64 12 L72 36 Z" fill="#1e293b" stroke="#facc15" stroke-width="2.5"/>
                    <rect x="34" y="24" width="12" height="12" rx="2.5" fill="#eab308"/>
                  </svg>
                </div>
                <div class="chest-mini-base">
                  <svg viewBox="0 0 80 48" class="chest-svg-base">
                    <rect x="8" y="4" width="64" height="40" rx="6" fill="#0f172a" stroke="#ca8a04" stroke-width="2.5"/>
                    <rect x="33" y="4" width="14" height="16" rx="2.5" fill="#facc15"/>
                    <circle cx="40" cy="11" r="2" fill="#000000"/>
                  </svg>
                </div>
              </div>
              <span class="chest-box-label">CHEST #1</span>
              <div class="chest-box-bottom" id="chestBottom1">
                <span class="chest-box-action">TAP TO OPEN</span>
              </div>
            </div>

            <!-- Chest Box 2 -->
            <div class="chest-box-card" id="chestBox2" onclick="onChestBoxClicked(2)">
              <div class="chest-box-glow"></div>
              <div class="chest-mini-aura"></div>
              <div class="chest-box-art">
                <div class="chest-floating-prize" id="chestFloatingPrize2"></div>
                <div class="chest-mini-lid" id="chestLid2">
                  <svg viewBox="0 0 80 40" class="chest-svg-lid">
                    <path d="M8 36 L16 12 Q40 4 64 12 L72 36 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
                    <rect x="34" y="24" width="12" height="12" rx="2.5" fill="#0284c7"/>
                  </svg>
                </div>
                <div class="chest-mini-base">
                  <svg viewBox="0 0 80 48" class="chest-svg-base">
                    <rect x="8" y="4" width="64" height="40" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="2.5"/>
                    <rect x="33" y="4" width="14" height="16" rx="2.5" fill="#38bdf8"/>
                    <circle cx="40" cy="11" r="2" fill="#000000"/>
                  </svg>
                </div>
              </div>
              <span class="chest-box-label cyan">CHEST #2</span>
              <div class="chest-box-bottom" id="chestBottom2">
                <span class="chest-box-action">TAP TO OPEN</span>
              </div>
            </div>

            <!-- Chest Box 3 -->
            <div class="chest-box-card" id="chestBox3" onclick="onChestBoxClicked(3)">
              <div class="chest-box-glow"></div>
              <div class="chest-mini-aura"></div>
              <div class="chest-box-art">
                <div class="chest-floating-prize" id="chestFloatingPrize3"></div>
                <div class="chest-mini-lid" id="chestLid3">
                  <svg viewBox="0 0 80 40" class="chest-svg-lid">
                    <path d="M8 36 L16 12 Q40 4 64 12 L72 36 Z" fill="#1e293b" stroke="#a855f7" stroke-width="2.5"/>
                    <rect x="34" y="24" width="12" height="12" rx="2.5" fill="#9333ea"/>
                  </svg>
                </div>
                <div class="chest-mini-base">
                  <svg viewBox="0 0 80 48" class="chest-svg-base">
                    <rect x="8" y="4" width="64" height="40" rx="6" fill="#0f172a" stroke="#9333ea" stroke-width="2.5"/>
                    <rect x="33" y="4" width="14" height="16" rx="2.5" fill="#a855f7"/>
                    <circle cx="40" cy="11" r="2" fill="#000000"/>
                  </svg>
                </div>
              </div>
              <span class="chest-box-label purple">CHEST #3</span>
              <div class="chest-box-bottom" id="chestBottom3">
                <span class="chest-box-action">TAP TO OPEN</span>
              </div>
            </div>
          </div>

          <div class="chest-loot-banner" id="chestLootBanner">
            <h4 class="loot-title" id="chestLootTitle">Mystery Vault</h4>
            <p class="loot-desc" id="chestLootDesc">Select any of the 3 chests to unlock with 1 Key for surprise rewards!</p>
          </div>

          <div class="chest-actions-wrapper">
            <button class="chest-action-main-btn" id="btnUnlockChest" onclick="unlockMysteryChest()">
              <span>🔑 UNLOCK RANDOM CHEST (1 KEY)</span>
            </button>
            <button class="chest-ad-buy-btn" id="btnChestAdBuy" onclick="buyChestKeyWithAd()">
              <span>🎬 GET 1 KEY (WATCH AD)</span>
            </button>
            <button class="chest-action-main-btn reset-btn" id="btnChestReset" onclick="resetThreeChests()" style="display: none;">
              <span>🔄 RESET CHESTS (NEXT ROUND)</span>
            </button>
          </div>
        </section>

      </div>
