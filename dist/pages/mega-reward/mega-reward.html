<div class="page-view" id="pageMegaReward">
        
  <!-- Top Action Nav Row -->
  <div class="xp-top-actions-row">
    <button class="xp-back-btn" onclick="switchPage('reward')">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Back</span>
    </button>

    <div class="xp-timer-pill">
      <span>👑 MEGA REWARDS</span>
    </div>

    <!-- Diamond Balance Button -->
    <button class="mega-diamond-balance-btn" id="megaRewardDiamondBtn" onclick="onMegaDiamondClick()" title="Diamond Balance">
      <span class="mega-diamond-icon">💎</span>
      <span class="mega-diamond-val" id="playerDiamondBalance">0</span>
    </button>
  </div>

  <!-- 9 Category Vertical Task Tabs Container -->
  <div class="tasks-scroll-container mega-vertical-tabs-list" id="megaVerticalTabsContainer">
    <!-- Populated dynamically as vertical task tabs by mega-reward.js -->
  </div>

  <!-- Mega Reward Redemption Modal -->
  <div class="redemption-modal-backdrop" id="rewardRedemptionBackdrop" onclick="closeRewardRedemptionModal(event)">
    <div class="redemption-modal-card" onclick="event.stopPropagation()">
      <div class="redemption-modal-header">
        <div class="redemption-header-left">
          <span class="redemption-icon" id="redeemModalIcon">🎁</span>
          <div>
            <h3 class="redemption-modal-title" id="redeemModalTitle">Redeem Reward</h3>
            <span class="redemption-modal-subtitle" id="redeemModalSub">Confirm your delivery details</span>
          </div>
        </div>
        <button class="redemption-close-btn" type="button" onclick="closeRewardRedemptionModal()">&times;</button>
      </div>

      <div class="redemption-summary-box">
        <div class="summary-cost-row">
          <span>Cost:</span>
          <strong class="cost-val" id="redeemModalCost">💎 500</strong>
        </div>
        <div class="summary-balance-row">
          <span>Your Balance:</span>
          <span id="redeemModalBalance">💎 1,200</span>
        </div>
        <div class="summary-after-row">
          <span>Balance After:</span>
          <span id="redeemModalAfter" style="color: #34d399; font-weight: 700;">💎 700</span>
        </div>
      </div>

      <form class="redemption-form" id="rewardRedemptionForm" onsubmit="handleRedemptionSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="redeemContact">Telegram Username / Contact *</label>
          <input type="text" id="redeemContact" class="redemption-input" placeholder="@username or phone" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="redeemAddress">Delivery Address / Details *</label>
          <textarea id="redeemAddress" class="redemption-input" rows="2" placeholder="Full postal address or gift voucher email" required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="redeemNotes">Notes (Optional)</label>
          <input type="text" id="redeemNotes" class="redemption-input" placeholder="e.g. preferred delivery time or voucher provider">
        </div>

        <button type="submit" class="btn-confirm-redemption" id="btnConfirmRedeem">
          <span>Confirm & Submit Request</span>
        </button>
      </form>
    </div>
  </div>

</div>
