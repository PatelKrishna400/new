<!-- PAGE: MEGA REWARDS ADD -->
<section class="page-panel" id="page-mega-add">
  <!-- Add / Edit Form -->
  <div class="card-panel" style="display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid rgba(25, 55, 120, 0.4); padding-bottom: 12px;">
      <h3 style="font-size: 16px; font-weight: 800; color: #fff;" id="rewardFormTitle">Add New Mega Reward</h3>
      <button onclick="seedSampleRewardsToFirebase()" class="btn-secondary" style="padding: 6px 12px; font-size: 11px;">✨ Seed 9 Sample Items</button>
    </div>

    <!-- Category Selection -->
    <div class="form-group">
      <label class="form-label">Category (9 Types)</label>
      <div class="category-grid" id="categoryChips">
        <!-- Injected dynamically -->
      </div>
    </div>

    <!-- Title & Tag -->
    <div class="mega-form-row-2col">
      <div class="form-group" style="flex: 2;">
        <label class="form-label">Reward Item Title</label>
        <input type="text" id="inpRewardTitle" placeholder="e.g. Apple AirPods Pro 2" class="form-input">
      </div>
      <div class="form-group" style="flex: 1;">
        <label class="form-label">Tag Badge</label>
        <input type="text" id="inpRewardTag" placeholder="e.g. SMART TECH" class="form-input" style="font-family: 'JetBrains Mono', monospace; color: #22d3ee;">
      </div>
    </div>

    <!-- Diamond Cost & Stock Units & Cash Value -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px;">
      <div class="form-group">
        <label class="form-label">Diamond Cost 💎</label>
        <input type="number" id="inpRewardDiamonds" placeholder="e.g. 2500" class="form-input" style="color: #22d3ee; font-weight: 800;">
      </div>
      <div class="form-group">
        <label class="form-label">Stock Units 📦</label>
        <input type="number" id="inpRewardStock" placeholder="e.g. 20" class="form-input" style="font-weight: 800;">
      </div>
      <div class="form-group">
        <label class="form-label">Cash Value 💵</label>
        <input type="text" id="inpRewardCashVal" placeholder="e.g. $100" class="form-input" style="color: #34d399; font-weight: 800;">
      </div>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label class="form-label">Reward Description</label>
      <input type="text" id="inpRewardDesc" placeholder="e.g. Exclusive high-end reward available for instant redemption" class="form-input">
    </div>

    <!-- Image Link -->
    <div class="form-group">
      <label class="form-label">Image URL (Optional)</label>
      <input type="url" id="inpRewardImage" placeholder="https://..." class="form-input" style="font-family: 'JetBrains Mono', monospace; color: #38bdf8;">
    </div>

    <div style="display: flex; gap: 10px; margin-top: 4px;">
      <button onclick="saveRewardToFirebase()" class="btn-primary" id="btnSaveReward">
        Save Reward to Firebase
      </button>
      <button onclick="clearRewardForm()" class="btn-secondary">
        Clear
      </button>
    </div>
  </div>

  <!-- Rewards Catalog Grid -->
  <div class="card-panel" style="display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h3 style="font-size: 16px; font-weight: 800; color: #fff;">Rewards Inventory</h3>
      <span style="font-size: 12px; color: #94a3b8;" id="rewardsInventoryMeta">0 items</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px;" id="rewardsCatalogGrid">
      <!-- Injected dynamically -->
    </div>
  </div>
</section>
