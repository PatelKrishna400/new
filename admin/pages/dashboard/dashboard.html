<!-- PAGE: DASHBOARD -->
<section class="page-panel active" id="page-dashboard">
  <!-- 3 Key Metric Cards -->
  <div class="metrics-row">
    <!-- 1. Total Players Number -->
    <div class="metric-box" onclick="switchAdminPage('users', 'User Analytics & Players')">
      <div class="metric-icon-box" style="background: rgba(2, 132, 199, 0.2); color: #38bdf8;">👥</div>
      <div class="metric-meta">
        <span class="metric-label">Total Player Number</span>
        <span class="metric-value" id="dashTotalPlayers">0</span>
      </div>
    </div>

    <!-- 2. Daily Tasks Completed Data -->
    <div class="metric-box" onclick="switchAdminPage('users', 'User Analytics & Players')">
      <div class="metric-icon-box" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">📅</div>
      <div class="metric-meta">
        <span class="metric-label">Daily Tasks Completed</span>
        <span class="metric-value" id="dashDailyTasksCompleted">0</span>
      </div>
    </div>

    <!-- 3. Web Tasks Completed Data -->
    <div class="metric-box" onclick="switchAdminPage('tasks-web', 'Tasks & Website Quests')">
      <div class="metric-icon-box" style="background: rgba(6, 182, 212, 0.2); color: #22d3ee;">🌐</div>
      <div class="metric-meta">
        <span class="metric-label">Web Tasks Completed</span>
        <span class="metric-value" id="dashWebTasksCompleted">0</span>
      </div>
    </div>

    <!-- 4. Ads Button Count -->
    <div class="metric-box" onclick="switchAdminPage('ads-manage', 'Ads & Monetization')">
      <div class="metric-icon-box" style="background: rgba(245, 158, 11, 0.2); color: #fbbf24;">🎬</div>
      <div class="metric-meta">
        <span class="metric-label">Ads Button Count</span>
        <span class="metric-value" id="dashAdsButtonCount">0</span>
      </div>
    </div>
  </div>

  <!-- Mini-Games Live Activity Row -->
  <div style="margin-top: 14px;">
    <h3 style="font-size: 14px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px;">Mini-Games Cloud Statistics</h3>
    <div class="metrics-row">
      <div class="metric-box">
        <div class="metric-icon-box" style="background: rgba(251, 191, 36, 0.2); color: #fde047;">🎡</div>
        <div class="metric-meta">
          <span class="metric-label">Lucky Wheel Spins</span>
          <span class="metric-value" id="dashTotalSpins">0</span>
        </div>
      </div>

      <div class="metric-box">
        <div class="metric-icon-box" style="background: rgba(168, 85, 247, 0.2); color: #c084fc;">🗝️</div>
        <div class="metric-meta">
          <span class="metric-label">Vault Chests Opened</span>
          <span class="metric-value" id="dashTotalChests">0</span>
        </div>
      </div>

      <div class="metric-box">
        <div class="metric-icon-box" style="background: rgba(236, 72, 153, 0.2); color: #f472b6;">🎴</div>
        <div class="metric-meta">
          <span class="metric-label">Scratch Cards Played</span>
          <span class="metric-value" id="dashTotalScratches">0</span>
        </div>
      </div>

      <div class="metric-box">
        <div class="metric-icon-box" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">🥚</div>
        <div class="metric-meta">
          <span class="metric-label">Eggs Hatched</span>
          <span class="metric-value" id="dashTotalEggs">0</span>
        </div>
      </div>
    </div>
  </div>
</section>
